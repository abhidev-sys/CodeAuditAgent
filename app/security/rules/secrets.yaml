rules:
  - id: python-hardcoded-password
    patterns:
      - pattern: password = "$VALUE"
      - pattern-not: password = ""
    message: "Hardcoded password detected"
    languages: [python]
    severity: ERROR
    metadata:
      vuln_type: SECRETS
      severity: CRITICAL
      cwe: CWE-798

  - id: python-hardcoded-api-key
    pattern: api_key = "$VALUE"
    message: "Hardcoded API key detected"
    languages: [python]
    severity: ERROR
    metadata:
      vuln_type: SECRETS
      severity: CRITICAL
      cwe: CWE-798