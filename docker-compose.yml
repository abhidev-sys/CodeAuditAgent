services:
  postgres:
    image: postgres:16-alpine
    container_name: codeaudit_postgres
    environment:
      POSTGRES_USER: codeaudit
      POSTGRES_PASSWORD: codeaudit
      POSTGRES_DB: codeauditdb
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: codeaudit_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: